name: 程式質量檢查

on:
  pull_request:
    paths:
      - "**/*.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Validate configuration
        run: python check_alerts.py --check-config

      - name: Compile Python
        run: python -m py_compile check_alerts.py tests/test_check_alerts.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

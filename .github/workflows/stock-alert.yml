name: 股票波動告警監控

on:
  # 主排程由 cron-job.org 每 2 分鐘觸發，避免與 GitHub schedule 雙重執行。
  workflow_dispatch:
    inputs:
      dry_run:
        description: 抓取及評估行情，但不發通知、不更新狀態
        required: false
        default: false
        type: boolean
      smoke_test:
        description: 任何時段驗證全部股票最近交易日行情，但不發通知、不更新狀態
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: >-
        ${{
          (inputs.dry_run || inputs.smoke_test)
          && format('stock-alert-validation-{0}', github.run_id)
          || 'stock-alert-production-v2'
        }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Get HKT date/timestamp
        id: today
        run: |
          echo "date=$(TZ='Asia/Hong_Kong' date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "ts=$(TZ='Asia/Hong_Kong' date +%Y-%m-%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Restore state cache
        if: ${{ !inputs.dry_run && !inputs.smoke_test }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: state/
          key: state-${{ steps.today.outputs.ts }}
          restore-keys: |
            state-${{ steps.today.outputs.date }}-

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run alert check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          SMOKE_TEST: ${{ inputs.smoke_test }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "$SMOKE_TEST" = "true" ]; then
            python check_alerts.py --smoke-test
          elif [ "$DRY_RUN" = "true" ]; then
            python check_alerts.py --dry-run
          else
            python check_alerts.py
          fi

      - name: Save state cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: ${{ !cancelled() && !inputs.dry_run && !inputs.smoke_test }}
        with:
          path: state/
          key: state-${{ steps.today.outputs.ts }}

name: 股票波動告警監控

on:
  # 主排程由 cron-job.org 每 2 分鐘觸發，避免與 GitHub schedule 雙重執行。
  workflow_dispatch:
    inputs:
      dry_run:
        description: 抓取及評估行情，但不發通知、不更新狀態
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stock-alert-production
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get HKT date/timestamp
        id: today
        run: |
          echo "date=$(TZ='Asia/Hong_Kong' date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "ts=$(TZ='Asia/Hong_Kong' date +%Y-%m-%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Restore state cache
        uses: actions/cache/restore@v5
        with:
          path: state/
          key: state-${{ steps.today.outputs.ts }}
          restore-keys: |
            state-${{ steps.today.outputs.date }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run alert check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python check_alerts.py --dry-run
          else
            python check_alerts.py
          fi

      - name: Save state cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: state/
          key: state-${{ steps.today.outputs.ts }}
